# ============================================================================
# pmoves-nats.conf — POWERFULMOVES NATS hub
# ----------------------------------------------------------------------------
# Stock nats-server (no Go patches) given the PMOVES treatment: multi-tenant
# trust-zone accounts (SYS/CORE/EDGE/CLOUD), a real leafnode listener, JetStream
# durability, and the websocket surface A2UI/browser clients ride. CHIT signing
# is an orthogonal payload-provenance layer that rides *inside* messages — the
# accounts model is the transport-trust layer; together they are the two gates.
#
# Spec:    PMOVES.AI pmoves/docs/specs/nats-accounts-leaf-topology-v0-spec-2026-08-07.md
# Runbook: PMOVES.AI pmoves/docs/operations/NATS_LEAF_TOPOLOGY_ROLLOUT_RUNBOOK.md
# Auth:    nsc-minted operator PMOVES -> SYS/CORE/EDGE/CLOUD (memory resolver).
# ============================================================================

server_name: $PMOVES_NATS_SERVER_NAME   # e.g. pmoves-nats-z890 (per-node; env-substituted)
port: 4222                              # client port (published cross-node)
max_payload: 8MB                        # CGP / geometry / prosodic packets run large

# --- Monitoring -------------------------------------------------------------
# HTTP monitoring is NOT credential-guarded by accounts (it is an HTTP surface,
# not a NATS-protocol one). It is guarded by LOOPBACK BINDING at the compose
# layer (publish 127.0.0.1:<host>->8222), never 0.0.0.0. The SYS account guards
# the NATS-protocol $SYS.* system subjects (real account guard). TLS+https_port
# is the documented follow-up (spec §11).
http_port: 8222

# --- JetStream (durability for CHIT trails, tokenism, streams) --------------
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 2GB
  max_file_store: 20GB
}

# --- Leaf nodes (the whole point: real 7422 listener) -----------------------
# Edge (jetson) and cloud (KVM) nodes attach here as account-scoped leaves,
# carrying their account binding via nsc-minted .creds. Publish 7422 cross-node
# in compose. Tailscale encrypts the transport; leaf-link TLS is a follow-up.
leafnodes {
  listen: 0.0.0.0:7422
}

# --- Websocket (A2UI / browser clients over the mesh) -----------------------
# no_tls: Tailscale already encrypts the transport for internal fleet use.
# Add TLS + allowed_origins when exposed beyond the tailnet (follow-up).
websocket {
  port: 8080
  no_tls: true
}

# --- MQTT (edge/IoT devices: jetson prosodic ears, sensors) -----------------
# Requires JetStream (enabled above) AND the connecting account to have
# JetStream. Ready but commented for v0 so the hub boots clean before per-account
# JetStream limits are set; uncomment when edge MQTT devices are wired.
# mqtt {
#   port: 1883
# }

# --- Logging ----------------------------------------------------------------
# Deliberately NOT debug/trace by default — a debug+no-TTL log firehose is the
# documented disk-fill footgun on this fleet (ClickHouse runaway, fix #2351).
debug: false
trace: false
logtime: true

# --- Accounts (memory resolver) ---------------------------------------------
# resolver_preload (the four public account JWTs) + system_account are rendered
# by `nsc generate config --mem-resolver` and injected by secrets-funnel from the
# CHIT vault at deploy time — the account JWTs are PUBLIC (non-secret) but change
# on account edit, so they are funnel-rendered, never hand-committed here.
# See examples/resolver_preload.conf.example for the shape.
include ./resolver_preload.conf
